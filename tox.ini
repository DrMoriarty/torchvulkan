[tox]
envlist = py{311,313,315}
isolated_build = true 
skip_missing_interpreters = true

[testenv]
passenv = *
deps =
    pytest
    pytest-xdist
    expecttest
    numpy
    ninja
commands =
    pytest tests/ {posargs}

[pytest]
# default parallel run: one process per worker, each with its own Vulkan instance
# (MoltenVK supports multiple processes). worksteal matters: per-test cost is uneven
# (0.1–3.4 s), a static round-robin would leave the last stragglers running alone.
# --maxprocesses caps the workers: the target dev machine has 4 GB VRAM (AMD Radeon
# Pro 5300M) and every worker holds its own pipeline cache, so don't use bare -n auto
# on many-core machines. Override on the command line with -n <k> as usual.
addopts = -n auto --maxprocesses 8 --dist worksteal